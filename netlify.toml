# ROSE — configuration Netlify

[build]
  # Site 100% statique — rien à builder, Netlify publie le dossier tel quel.
  publish = "."

# En-têtes de sécurité appliqués à toutes les réponses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache long pour les assets versionnés
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML : pas de cache agressif (on veut que les modifs de texte apparaissent vite)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Gate Basic Auth sur tout le site
[[edge_functions]]
  path = "/*"
  function = "auth"
